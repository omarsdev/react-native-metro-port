<!doctype html>
<!-- Source of how-it-works.gif. Run `node docs/render-animation.js` to rebuild it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 960px; height: 540px; overflow: hidden; background: #0f172a; }
  body { position: relative; color: #e2e8f0; font: 500 20px -apple-system, "SF Pro Text", Helvetica, sans-serif; }
  .abs { position: absolute; }
  #badge { top: 26px; left: 40px; padding: 6px 14px; border-radius: 8px; font-size: 16px; font-weight: 700; }
  #caption { left: 40px; right: 40px; bottom: 34px; text-align: center; font-size: 25px; font-weight: 600; line-height: 1.3; }
  .card { width: 290px; height: 112px; border-radius: 14px; padding: 16px 20px; background: #1e293b; border: 3px solid #334155; }
  .card h3 { font-size: 22px; font-weight: 700; }
  .card p { margin-top: 6px; font: 500 18px Menlo, monospace; color: #94a3b8; }
  .verdict { right: 16px; bottom: 16px; font-size: 16px; font-weight: 700; padding: 3px 10px; border-radius: 6px; }
  #phone { left: 70px; top: 96px; width: 190px; height: 360px; border-radius: 28px; background: #020617; border: 4px solid #475569; padding: 14px; }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 16px; background: #1e293b; overflow: hidden; }
  #appname { top: 14px; left: 0; right: 0; text-align: center; font-size: 15px; color: #94a3b8; font-weight: 600; }
  #bad, #good { inset: 0; padding: 44px 12px 10px; }
  #bad { background: #991b1b; color: #fff; font: 600 15px/1.4 Menlo, monospace; }
  #good { background: #0f172a; text-align: center; }
  #good b { display: block; margin-top: 74px; font-size: 56px; color: #4ade80; }
  #good span { display: block; margin-top: 10px; font-size: 17px; font-weight: 600; }
  #end { inset: 0; background: #0f172a; text-align: center; padding-top: 118px; }
  #end h1 { font-size: 46px; font-weight: 800; }
  #end pre { display: inline-block; margin-top: 34px; padding: 18px 28px; border-radius: 12px; background: #020617; color: #4ade80; font: 600 25px Menlo, monospace; }
  #end p { margin-top: 34px; font-size: 22px; color: #94a3b8; }
  svg { position: absolute; inset: 0; }
</style>
</head>
<body>
  <div id="badge" class="abs"></div>
  <div id="phone" class="abs"><div id="screen">
    <div id="appname" class="abs">Project B app</div>
    <div id="bad" class="abs">"ProjectB" has not been registered</div>
    <div id="good" class="abs"><b>✓</b><span>Project B is running</span></div>
  </div></div>
  <div id="cardA" class="abs card" style="left:630px;top:112px"><h3>Project A Metro</h3><p>port 8081</p><div id="vA" class="abs verdict"></div></div>
  <div id="cardB" class="abs card" style="left:630px;top:290px"><h3>Project B Metro</h3><p>port 8082</p><div id="vB" class="abs verdict"></div></div>
  <div id="build" class="abs card" style="left:326px;top:206px;width:224px;height:100px;text-align:center"><h3>Your build</h3><p style="font-size:15px">Xcode, Android Studio or CLI</p></div>
  <svg width="960" height="540">
    <line id="line" x1="260" y1="276" x2="630" y2="168" stroke-width="5" stroke-linecap="round"/>
    <circle id="dot" r="11"/>
  </svg>
  <div id="caption" class="abs"></div>
  <div id="end" class="abs">
    <h1>react-native-metro-port</h1>
    <pre>yarn add --dev react-native-metro-port</pre>
    <p>iOS and Android · Debug builds only · Nothing to configure</p>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const show = (id, on) => { $(id).style.opacity = on ? 1 : 0; };
  const RED = '#f87171', GREEN = '#4ade80', BLUE = '#60a5fa', GREY = '#334155';
  const A = [630, 168], B = [630, 346], PHONE = [260, 276], BUILD = [550, 256];

  function travel(from, to, p) {
    p = Math.min(1, Math.max(0, p));
    const e = p * p * (3 - 2 * p);
    return [from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e];
  }
  function line(from, to, color) {
    const l = $('line');
    l.setAttribute('x1', from[0]); l.setAttribute('y1', from[1]);
    l.setAttribute('x2', to[0]); l.setAttribute('y2', to[1]);
    l.setAttribute('stroke', color);
  }
  function dot(at, color) {
    const d = $('dot');
    d.setAttribute('cx', at[0]); d.setAttribute('cy', at[1]);
    d.setAttribute('fill', color); d.style.opacity = 1;
  }
  function verdict(id, text, color) {
    const v = $(id);
    v.textContent = text; v.style.opacity = text ? 1 : 0;
    v.style.background = color; v.style.color = '#0f172a';
  }
  function reset(badge, color, caption) {
    $('badge').textContent = badge; $('badge').style.background = color; $('badge').style.color = '#0f172a';
    $('caption').textContent = caption;
    for (const id of ['bad', 'good', 'end', 'build']) show(id, false);
    verdict('vA', ''); verdict('vB', '');
    $('dot').style.opacity = 0; $('line').setAttribute('stroke', 'none');
    $('cardA').style.borderColor = GREY; $('cardB').style.borderColor = GREY;
    show('phone', true);
  }

  // Everything is a pure function of t, so each frame can be rendered on its own.
  window.DURATION = 24;
  window.render = (t) => {
    if (t < 2.5) {
      reset('WITHOUT THIS PACKAGE', RED, "You're working on Project B. Project A's Metro already holds port 8081.");
    } else if (t < 5) {
      reset('WITHOUT THIS PACKAGE', RED, 'But your app was built for port 8081.');
      line(PHONE, A, RED); dot(travel(PHONE, A, (t - 2.7) / 1.8), RED);
    } else if (t < 9) {
      reset('WITHOUT THIS PACKAGE', RED, "So it loads Project A's JavaScript. The error doesn't say why.");
      line(PHONE, A, RED); $('cardA').style.borderColor = RED;
      dot(travel(A, PHONE, (t - 5) / 1.2), RED); show('bad', t > 6.2);
    } else if (t < 12) {
      reset('WITH react-native-metro-port', GREEN, 'During the build, it asks each Metro: which project are you?');
      show('build', true);
      line(BUILD, A, BLUE); dot(travel(BUILD, A, (t - 9.3) / 1.2), BLUE);
      if (t > 10.5) { verdict('vA', 'Project A ✗', RED); }
    } else if (t < 15) {
      reset('WITH react-native-metro-port', GREEN, 'It finds the Metro that belongs to this project.');
      show('build', true); verdict('vA', 'Project A ✗', RED);
      line(BUILD, B, BLUE); dot(travel(BUILD, B, (t - 12.2) / 1.2), BLUE);
      if (t > 13.4) { verdict('vB', 'Project B ✓', GREEN); $('cardB').style.borderColor = GREEN; }
    } else if (t < 20) {
      reset('WITH react-native-metro-port', GREEN, 'Your app connects to your Metro. Nothing to configure.');
      verdict('vB', 'Project B ✓', GREEN); $('cardB').style.borderColor = GREEN;
      line(PHONE, B, GREEN);
      const p = (t - 15.2) / 1.5;
      dot(p < 1 ? travel(PHONE, B, p) : travel(B, PHONE, p - 1), GREEN);
      show('good', t > 18.2);
    } else {
      reset('', 'transparent', ''); show('end', true);
    }
  };
  render(0);
</script>
</body>
</html>
